---
- name: "Install hvac within a home directory (instead of venv madness...)"
  ansible.builtin.pip:
    name: hvac
    extra_args: --user
- name: Set Fact
  set_fact:
    subdomain: "{{ inventory_hostname.split('.')[1:] | join('.') }}"
- name: Debug
  debug:
    msg: "Rotating certs for {{ subdomain }} into vault"

### 2025 - Adding fix for ubiquiti being dumb
### Default to wildcart path
- name: Check if file exists
  stat:
    path: "../roles/internal_dns_vault/files/certificates/{{ subdomain }}/{{ vault_cert_algo }}/_.{{ subdomain }}.crt"
  register: file_stat

- name: Set variable based on file existence
  set_fact:
    preamble: "{{ '_.' if file_stat.stat.exists else '' }}"

- name: Find out playbook's path
  shell: pwd
  register: playbook_path_output
- debug: var=playbook_path_output.stdout
- name: Read certificate from disk
  slurp:
    src: "../roles/internal_dns_vault/files/certificates/{{ subdomain }}/{{ vault_cert_algo }}/{{ preamble }}{{ subdomain }}.crt"
  register: cert_content

- name: Convert certificate content to string
  set_fact:
    crt_string: "{{ cert_content['content'] | b64decode }}"
- name: Read key from disk
  slurp:
    src: "../roles/internal_dns_vault/files/certificates/{{ subdomain }}/{{ vault_cert_algo }}/{{ preamble }}{{ subdomain }}.key"
  register: key_content

- name: Convert certificate content to string
  set_fact:
    key_string: "{{ key_content['content'] | b64decode }}"

- name: Write/create a secret
  community.hashi_vault.vault_kv2_write:
    url: "{{ vault_address }}"
    engine_mount_point: certs
    path: "{{ vault_cert_algo }}/{{ preamble }}{{ subdomain }}"
    auth_method: userpass
    username: "{{ vault_cert_user }}"
    password: "{{ vault_cert_password }}"
    validate_certs: "{{ validate_certs | default(true) }}"
    data:
      key: "{{ key_string }}"
      crt: "{{ crt_string }}"
