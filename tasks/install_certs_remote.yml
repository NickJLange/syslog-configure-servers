---
- name: Derive subdomain
  include_tasks: derive_subdomain.yml

- name: Debug
  debug:
    msg: "Rotating certs for {{ subdomain }}"

- name: Read a secret
  community.hashi_vault.vault_kv2_get:
    url: "{{ vault_address }}"
    engine_mount_point: certs
    path: "{{ vault_cert_algo }}/_.{{ subdomain }}"
    auth_method: userpass
    validate_certs: "{{ validate_certs | default(true) }}"
    username: "{{ vault_cert_user }}"
    password: "{{ vault_cert_password }}"
  register: vault_secret
  delegate_to: localhost
  become: false
  vars:
    ansible_python_interpreter: "{{ cert_mgmt_venv_path }}/bin/python3"
- block:
    - name: Check directory exists
      file:
        path: "{{ ssl_cert_dir }}"
        state: directory
        mode: 0755
        owner: root
        group: root
    - name: Check directory exists
      file:
        path: "{{ ssl_backup_dir }}"
        state: directory
        mode: 0755
        owner: root
        group: root

    - name: Backup certs to directory
      shell: "mv -f {{ ssl_cert_dir }}/*.crt {{ ssl_cert_dir }}/*.key {{ ssl_backup_dir }}"
      ignore_errors: true

    - name: Copy public key file
      copy:
        content: "{{ vault_secret.data.data.crt}}"
        dest: "{{ ssl_cert_dir }}/{{ item }}"
        owner: root
        group: root
        mode: 0644
      loop:
        - "{{ subdomain }}.crt"
    #      - "unifi-core-direct.crt"

    - name: Copy private key file
      copy:
        content: "{{ vault_secret.data.data.key}}"
        dest: "{{ ssl_cert_dir }}/{{ item }}"
        owner: root
        group: root
        mode: 0644
      loop:
        - "{{ subdomain }}.key"
        #      - "unifi-core-direct.key"

    - name: Symlink to server.cert
      file:
        src: "{{ item }}"
        dest: "{{ ssl_cert_dir }}/server.cert"
        force: yes
        state: link
        mode: 0644
      loop:
        - "{{ subdomain }}.crt"
    #      - "unifi-core-direct.crt"

    - name: Symlink to server.key
      file:
        src: "{{ item }}"
        dest: "{{ ssl_cert_dir }}/server.key"
        force: yes
        state: link
        mode: 0644
      loop:
        - "{{ subdomain }}.key"
        #      - "unifi-core-direct.key"

  become: true
